# Publish the study app to GitHub Pages.
#
# Nothing is compiled here. The Python toolchain has already produced the
# decks, the notes and program.json, and they are committed; `npm run build`
# only gathers them into public/ and flips the app into static mode. So a
# deploy is a copy, and it reflects whatever was last built and pushed.
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:        # lets you redeploy by hand from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it halfway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Assemble public/
        run: npm run build
      - uses: actions/configure-pages@v5
        with:
          # Turn Pages on via the API if it is not already. Without
          # this the first run fails with "Get Pages site failed"
          # even when the repository setting looks correct, because
          # the site record does not exist until something creates it.
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
